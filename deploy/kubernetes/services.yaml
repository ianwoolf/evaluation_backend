apiVersion: v1
kind: Namespace
metadata:
  name: evaluation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-runtime
  namespace: evaluation
data:
  EVAL_MODEL_RESOLVER_URL: http://evaluation-api.evaluation.svc.cluster.local:8001
  EVAL_COLLECTOR_EXPORTER: elasticsearch
  EVAL_PLATFORM: storage
  EVAL_LLM_PROXY_ENABLED: 'true'
  EVAL_CONCURRENCY: '1'
  EVAL_STORAGE_API_URL: http://evaluation-api.evaluation.svc.cluster.local:8001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-storage
  namespace: evaluation
data:
  EVAL_STORAGE_BACKEND: elasticsearch
  EVAL_ES_URL: http://evaluation-es:9200
  EVAL_ES_VERIFY_SSL: 'false'
  EVAL_ES_USERNAME: ''
  EVAL_ES_RECORDS_INDEX: evaluation-records-v2
  EVAL_ES_SAMPLES_INDEX: evaluation-samples-v2
  EVAL_ES_TRACES_INDEX: evaluation-traces-v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-observability
  namespace: evaluation
data:
  EVAL_LOG_LEVEL: INFO
  # Optional external OTLP HTTP/protobuf logs receiver:
  # OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
  # OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-api-config
  namespace: evaluation
data:
  EVAL_AUTH_MODE: none
  EVAL_DEFAULT_PROJECT_ID: individual
  EVAL_EXECUTION_BACKEND: kubernetes
  EVAL_MODEL_REGISTRY: /config/models.json
  EVAL_WORKER_IMAGE: evaluation-worker:configured-datasets-20261030
  EVAL_UPLOAD_DIR: /uploads
  EVAL_CONTENT_POLICY: '{"input":"retain","response":"retain","reference":"retain"}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-api
  namespace: evaluation
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-worker
  namespace: evaluation
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-api
  namespace: evaluation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-api
  template:
    metadata:
      labels:
        app: evaluation-api
    spec:
      serviceAccountName: evaluation-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: evaluation-worker:configured-datasets-20261030
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - uvicorn
        - evaluation_backend.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8001'
        - --no-access-log
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: evaluation-api-config
        - configMapRef:
            name: evaluation-storage
        - secretRef:
            name: evaluation-credentials
        - configMapRef:
            name: evaluation-observability
        volumeMounts:
        - name: models
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /uploads
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
      volumes:
      - name: models
        projected:
          sources:
          - configMap:
              name: evaluation-model-registry
      - name: tmp
        emptyDir: {}
      - name: uploads
        persistentVolumeClaim:
          claimName: evaluation-uploads
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-api
  namespace: evaluation
spec:
  selector:
    app: evaluation-api
  ports:
  - port: 8001
    targetPort: 8001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evaluation-jobs
  namespace: evaluation
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evaluation-jobs
  namespace: evaluation
subjects:
- kind: ServiceAccount
  name: evaluation-api
  namespace: evaluation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evaluation-jobs
