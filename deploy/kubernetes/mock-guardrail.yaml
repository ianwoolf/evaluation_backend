apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-mock-guardrail
  namespace: evaluation
data:
  EVAL_MOCK_GUARDRAIL_ID: mock-guardrail
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-mock-guardrail
  namespace: evaluation
spec:
  replicas: 1
  selector:
    matchLabels: {app: evaluation-mock-guardrail}
  template:
    metadata:
      labels: {app: evaluation-mock-guardrail}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: mock-guardrail
        image: evaluation-mock-guardrail:request-logs-20261104
        imagePullPolicy: IfNotPresent
        ports:
        - {containerPort: 8002, name: http}
        envFrom:
        - configMapRef: {name: evaluation-mock-guardrail}
        env:
        - name: EVAL_MOCK_GUARDRAIL_TOKEN
          valueFrom:
            secretKeyRef: {name: evaluation-mock-guardrail, key: token}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /ready, port: http}
        livenessProbe:
          httpGet: {path: /health, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-mock-guardrail
  namespace: evaluation
spec:
  selector: {app: evaluation-mock-guardrail}
  ports:
  - {port: 8002, targetPort: http}
