# API-owned temporary data; mount only in evaluation-api, never in workers.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evaluation-uploads
  namespace: evaluation
spec:
  # Uses the cluster default StorageClass; set explicitly if your cluster has none.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
