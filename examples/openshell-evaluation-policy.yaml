version: 1
process:
  run_as_user: '10001'
  run_as_group: '10001'
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /proc, /dev/urandom, /app, /etc, /var/log, /opt]
  read_write: [/sandbox, /tmp, /dev/null, /home/worker]
landlock:
  compatibility: best_effort
network_policies:
  evaluation_services:
    name: evaluation-services
    endpoints:
      - {host: 192.168.65.254, port: 8001, allowed_ips: [192.168.65.254/32]}
      - {host: 192.168.65.254, port: 3000, allowed_ips: [192.168.65.254/32]}
      - {host: open.bigmodel.cn, port: 443}
      - {host: 127.0.0.1, port: 18090, allowed_ips: [127.0.0.1/32]}
    binaries:
      - {path: /usr/local/bin/python3.12}
      - {path: /usr/local/bin/python}
