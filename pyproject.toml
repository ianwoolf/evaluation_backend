[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-backend"
version = "0.1.0"
description = "Independent evaluation service with OpenShell execution and pluggable result publishing"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "python-dotenv>=1,<2", "httpx>=0.27,<1", "PyYAML>=6,<7", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "opentelemetry-sdk>=1.39,<2", "opentelemetry-exporter-otlp-proto-http>=1.39,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
